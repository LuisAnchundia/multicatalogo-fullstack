# Un solo enlace HTTPS para la interfaz React y la API Go.
services:
  - type: web
    name: multicatalogo-luis
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: multicatalogo-db-luis
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: multicatalogo-cache-luis
          property: connectionString
      - key: TOKEN_SECRET
        generateValue: true

  - type: keyvalue
    name: multicatalogo-cache-luis
    plan: free
    region: oregon
    ipAllowList: []

databases:
  - name: multicatalogo-db-luis
    plan: free
    region: oregon
    databaseName: multicatalogo
    user: multicatalogo
    ipAllowList: []
